<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wallFour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAE3D5"/>
      <stop offset="100%" stop-color="#DBD0C0"/>
    </linearGradient>
    <linearGradient id="floorFour" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C6B45"/>
      <stop offset="100%" stop-color="#7B502F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#wallFour)"/>
  <rect y="520" width="1200" height="280" fill="url(#floorFour)"/>

  <!-- AC unit -->
  <rect x="480" y="70" width="240" height="65" rx="6" fill="#FFFFFF" stroke="#D3C9BA" stroke-width="3"/>

  <!-- Bed 1 & 2 (First Double Bed) -->
  <rect x="80" y="240" width="460" height="200" rx="10" fill="#3D291D"/>
  <rect x="100" y="390" width="420" height="150" rx="8" fill="#FFFFFF"/>
  <rect x="120" y="355" width="160" height="70" rx="8" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="340" y="355" width="160" height="70" rx="8" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="100" y="455" width="420" height="85" fill="#C27847"/>

  <!-- Bed 3 & 4 (Second Double Bed / Twin Setup) -->
  <rect x="660" y="240" width="460" height="200" rx="10" fill="#3D291D"/>
  <rect x="680" y="390" width="420" height="150" rx="8" fill="#FFFFFF"/>
  <rect x="700" y="355" width="160" height="70" rx="8" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="920" y="355" width="160" height="70" rx="8" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="680" y="455" width="420" height="85" fill="#2E5041"/>

  <!-- Label badge -->
  <rect x="40" y="660" width="540" height="100" rx="12" fill="#1E3A2F" opacity="0.95"/>
  <text x="68" y="705" fill="#F6F3EB" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Four Bed Room • Room 102</text>
  <text x="68" y="740" fill="#C2D8CD" font-family="system-ui, sans-serif" font-size="16">Replace with: images/rooms/room-four-bed.jpg (1200 × 800 px)</text>
</svg>
