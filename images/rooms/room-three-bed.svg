<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wallThree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBE3D7"/>
      <stop offset="100%" stop-color="#DDD3C4"/>
    </linearGradient>
    <linearGradient id="floorThree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8F623F"/>
      <stop offset="100%" stop-color="#6F4B30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#wallThree)"/>
  <rect y="520" width="1200" height="280" fill="url(#floorThree)"/>

  <!-- AC unit -->
  <rect x="140" y="80" width="240" height="65" rx="6" fill="#FFFFFF" stroke="#D3C9BA" stroke-width="3"/>

  <!-- Main Double Bed -->
  <rect x="120" y="240" width="460" height="200" rx="10" fill="#4A3423"/>
  <rect x="140" y="390" width="420" height="150" rx="8" fill="#FFFFFF"/>
  <rect x="160" y="355" width="160" height="70" rx="8" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="380" y="355" width="160" height="70" rx="8" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="140" y="455" width="420" height="85" fill="#C27847"/>

  <!-- Single Bed (3rd Bed) -->
  <rect x="680" y="270" width="360" height="180" rx="10" fill="#4A3423"/>
  <rect x="700" y="390" width="320" height="150" rx="8" fill="#FFFFFF"/>
  <rect x="740" y="355" width="160" height="70" rx="8" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="700" y="455" width="320" height="85" fill="#2E5041"/>

  <!-- Window -->
  <rect x="620" y="60" width="220" height="180" rx="4" fill="#B9D5CE" stroke="#5E3821" stroke-width="6"/>

  <!-- Label badge -->
  <rect x="40" y="660" width="540" height="100" rx="12" fill="#1E3A2F" opacity="0.95"/>
  <text x="68" y="705" fill="#F6F3EB" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Three Bed Room • Room 101</text>
  <text x="68" y="740" fill="#C2D8CD" font-family="system-ui, sans-serif" font-size="16">Replace with: images/rooms/room-three-bed.jpg (1200 × 800 px)</text>
</svg>

