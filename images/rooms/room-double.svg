<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wallDbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFE9DE"/>
      <stop offset="100%" stop-color="#E2D9CA"/>
    </linearGradient>
    <linearGradient id="floorDbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A5734E"/>
      <stop offset="100%" stop-color="#805434"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="1200" height="520" fill="url(#wallDbl)"/>
  <!-- Floor -->
  <rect y="520" width="1200" height="280" fill="url(#floorDbl)"/>

  <!-- Window -->
  <rect x="120" y="80" width="280" height="380" rx="4" fill="#B9D5CE" stroke="#8A6749" stroke-width="8"/>
  <line x1="260" y1="80" x2="260" y2="460" stroke="#8A6749" stroke-width="6"/>
  <line x1="120" y1="270" x2="400" y2="270" stroke="#8A6749" stroke-width="6"/>

  <!-- AC Unit on wall -->
  <rect x="780" y="100" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#D3C9BA" stroke-width="3"/>
  <line x1="800" y1="150" x2="1020" y2="150" stroke="#B0A695" stroke-width="3"/>

  <!-- Headboard -->
  <rect x="520" y="240" width="560" height="220" rx="12" fill="#5E3821"/>

  <!-- Bed Base & Mattress (Double Bed) -->
  <rect x="550" y="420" width="500" height="150" rx="8" fill="#FFFFFF"/>
  <rect x="530" y="520" width="540" height="60" rx="4" fill="#3D2517"/>

  <!-- Pillows -->
  <rect x="580" y="380" width="180" height="80" rx="10" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>
  <rect x="810" y="380" width="180" height="80" rx="10" fill="#F7F4EE" stroke="#DDD4C4" stroke-width="2"/>

  <!-- Bed Runner -->
  <rect x="550" y="490" width="500" height="80" fill="#1E3A2F"/>

  <!-- Nightstand -->
  <rect x="420" y="440" width="90" height="120" rx="6" fill="#805434"/>

  <!-- Rug -->
  <ellipse cx="780" cy="650" rx="360" ry="80" fill="#D8CFBD" opacity="0.8"/>

  <!-- Label badge -->
  <rect x="40" y="660" width="540" height="100" rx="12" fill="#1E3A2F" opacity="0.95"/>
  <text x="68" y="705" fill="#F6F3EB" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Double Bed Room • Rooms 103 &amp; 104</text>
  <text x="68" y="740" fill="#C2D8CD" font-family="system-ui, sans-serif" font-size="16">Replace with: images/rooms/room-double.jpg (1200 × 800 px)</text>
</svg>

