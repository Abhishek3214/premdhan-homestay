<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="340" fill="#E2EBE5"/>
  <rect y="340" width="800" height="260" fill="#4A524D"/>
  <!-- Parking Bays and Lines -->
  <line x1="200" y1="340" x2="160" y2="600" stroke="#F4F7F5" stroke-width="8" stroke-dasharray="16 12"/>
  <line x1="420" y1="340" x2="420" y2="600" stroke="#F4F7F5" stroke-width="8"/>
  <line x1="640" y1="340" x2="680" y2="600" stroke="#F4F7F5" stroke-width="8" stroke-dasharray="16 12"/>

  <!-- Parking 'P' Sign -->
  <circle cx="420" cy="180" r="60" fill="#1E3A2F"/>
  <text x="420" y="206" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="76" font-weight="800" text-anchor="middle">P</text>
  <rect x="412" y="240" width="16" height="100" fill="#1E3A2F"/>

  <!-- Homestay Wall in background -->
  <rect x="60" y="140" width="220" height="200" fill="#F4EFE6" stroke="#D3C9BA" stroke-width="4"/>
  <polygon points="40,140 170,80 300,140" fill="#C27847"/>
  <rect x="520" y="140" width="220" height="200" fill="#F4EFE6" stroke="#D3C9BA" stroke-width="4"/>

  <!-- Tag overlay -->
  <rect x="24" y="500" width="380" height="76" rx="10" fill="#1E3A2F" opacity="0.94"/>
  <text x="44" y="534" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Free On-Site Guest Parking</text>
  <text x="44" y="560" fill="#BED9CE" font-family="system-ui, sans-serif" font-size="13">Category: Parking (800 × 600 px)</text>
</svg>

