<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#EAE3D6"/>
  <!-- Bedroom with multiple beds -->
  <rect x="60" y="240" width="320" height="200" rx="8" fill="#5A3A25"/>
  <rect x="75" y="340" width="290" height="130" rx="6" fill="#FFFFFF"/>
  <rect x="75" y="400" width="290" height="70" fill="#C27847"/>

  <rect x="420" y="240" width="320" height="200" rx="8" fill="#5A3A25"/>
  <rect x="435" y="340" width="290" height="130" rx="6" fill="#FFFFFF"/>
  <rect x="435" y="400" width="290" height="70" fill="#2E5041"/>

  <!-- AC unit -->
  <rect x="290" y="80" width="220" height="55" rx="6" fill="#FFFFFF" stroke="#D3C9BA" stroke-width="2"/>

  <!-- Tag overlay -->
  <rect x="24" y="500" width="380" height="76" rx="10" fill="#1E3A2F" opacity="0.94"/>
  <text x="44" y="534" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Room 102 • Four Bed Room</text>
  <text x="44" y="560" fill="#BED9CE" font-family="system-ui, sans-serif" font-size="13">Category: Rooms (800 × 600 px)</text>
</svg>
