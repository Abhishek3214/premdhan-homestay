<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#EAE4D8"/>
  <!-- Three Bed Room layout -->
  <rect x="80" y="220" width="360" height="220" rx="8" fill="#4A3423"/>
  <rect x="95" y="320" width="330" height="150" rx="6" fill="#FFFFFF"/>
  <rect x="95" y="380" width="330" height="70" fill="#C27847"/>

  <rect x="480" y="250" width="260" height="190" rx="8" fill="#4A3423"/>
  <rect x="495" y="340" width="230" height="130" rx="6" fill="#FFFFFF"/>
  <rect x="495" y="390" width="230" height="60" fill="#2E5041"/>

  <!-- AC unit -->
  <rect x="290" y="80" width="220" height="55" rx="6" fill="#FFFFFF" stroke="#D3C9BA" stroke-width="2"/>

  <!-- Tag overlay -->
  <rect x="24" y="500" width="380" height="76" rx="10" fill="#1E3A2F" opacity="0.94"/>
  <text x="44" y="534" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Room 101 • Three Bed Room</text>
  <text x="44" y="560" fill="#BED9CE" font-family="system-ui, sans-serif" font-size="13">Category: Rooms (800 × 600 px)</text>
</svg>
